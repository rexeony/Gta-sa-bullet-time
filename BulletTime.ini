; Bullet Time + Dodge (GTA SA Android, AML arm64)
; Letakkan di: /sdcard/Android/data/com.rockstargames.gtasa/configs/BulletTime.ini
; File ini dibuat/dilengkapi otomatis saat game pertama kali dijalankan dengan mod.
; Nama tombol pad: LeftShoulder1 LeftShoulder2 RightShoulder1 RightShoulder2 DPadUp DPadDown DPadLeft DPadRight
;                  Start Select ButtonSquare ButtonTriangle ButtonCross ButtonCircle ShockButtonL ShockButtonR None

[Main]
Enabled=1
; 1 = log tombol pad yang kamu sentuh ke logcat
DebugPad=0

[Debug]
; Matikan satu per satu untuk mencari penyebab crash (0 = hook tidak dipasang)
HookPlayer=1
HookAnim=1
HookHydra=1
; Flag widget hidrolik (angka desimal) saat jalan kaki: bit yang dihapus / ditambah. Bawaan: hapus bit nonaktif (4)
HydraFlagClear=4
HydraFlagSet=0

[BulletTime]
; 1 = tombol hidrolik dimunculkan saat berjalan kaki (tidak muncul/aktif saat berkendara)
; Tap 1x = bullet time on/off
HydraulicsButtonOnFoot=1
; 0 = tap 1x bullet time on/off, tap 2x cepat = dodge | 1 = tap langsung dodge (untuk menguji animasi)
HydraulicsMode=0
; Tombol pad opsional (None = tidak dipakai)
ActivateButton=None
HoldToActivate=0
; Kecepatan dunia saat bullet time (1.0 normal)
WorldSpeed=0.35
; Kecepatan CJ saat bullet time relatif ke normal. Harus lebih besar dari WorldSpeed supaya CJ lebih cepat dari dunia
CJSpeed=0.6
BlendIn=0.12
BlendOut=0.25
; Meter adrenalin: lama bullet time penuh (detik nyata) dan isi ulang per detik
Duration=14.0
RefillPerSec=0.04
StartMeter=1.0
ActivationMinimum=0.05

[Bar]
; Bar adrenalin bullet time di layar saat jalan kaki (posisi/ukuran = pecahan layar)
ShowBar=1
BarX=0.35
BarY=0.04
BarWidth=0.30
BarHeight=0.022

[Aim]
; 1 = paksa mode bidik (aim) selama dive, baik sudah membidik maupun belum
ForceAimWhileDiving=1
; 1 = catat perubahan status aim ke BulletTime_log.txt (membantu diagnosa)
LogAim=1
; Tidak dipakai lagi (aim di game ini tidak lewat GetTarget)
HookGetTarget=0
; 1 = catat ID widget sentuh yang disentuh ke log (diagnosa: tombol mana yang ikut tersentuh)
LogTouchedWidgets=1
; Hook fungsi masuk/keluar mode bidik (dipakai untuk memulai aim saat dive dan mencegah aim berhenti)
HookGetEnterTargeting=1
HookGetExitTargeting=1

[Dodge]
; 1 = kalau animasi IFP tidak tersedia, pakai lompat bawaan. 0 = hanya dorongan tanpa lompat
FallbackJump=1
; 1 = animasi dive dimainkan lewat task bawaan game (tidak ditimpa game)
UseAnimTask=1
; 1 = animasi di slot sekunder (parsial): aim & tembak tetap bisa saat dive. 0 = slot utama (mengambil alih kontrol)
AnimInSecondarySlot=1
; 16 = ANIM_FLAG_PARTIAL (dipakai bersama slot sekunder)
TaskFlags=16
; lama CJ meluncur mendatar saat dodge (detik nyata)
DashSeconds=0.6
; batas maksimum dive (detik nyata). Biasanya dive berakhir sendiri saat animasinya selesai
DiveDuration=3.0
; 1 = tahan pose terakhir dive sampai DiveDuration habis (0 = berakhir sendiri saat animasi selesai)
HoldLastFrame=0
; kecepatan animasi saat dive (1.0 normal, lebih kecil = dive lebih lama)
DiveAnimSpeed=0.55
; 1 = stik gerak dikunci selama pose dive supaya CJ tidak berjalan sendiri
FreezeStickWhileDiving=1
; 1 = tap 2x cepat tombol hidrolik = dodge
HydraulicsDoubleTapDodge=1
DoubleTapWindow=0.5
; Tombol pad opsional untuk dodge (tap 2x), None = tidak dipakai
DiveButton=None
; Kecepatan dorongan dodge (satuan game per tick) dan lompatan ke atas
DiveSpeed=0.16
DiveUpSpeed=0.0
; 1 = dodge otomatis memicu bullet time
AutoBulletTime=1
DiveSlowSeconds=2.5
; Animasi dodge dari MP3SD.ifp (sd_dive_fwd/bkw/left/right). Kalau gagal dimuat, dodge memakai lompat bawaan.
UseIFP=1
; Kosongkan = /sdcard/Android/data/com.rockstargames.gtasa/files/BulletTime/MP3SD.ifp
IFPPath=
AnimFlags=0
AnimBlend=8.0
