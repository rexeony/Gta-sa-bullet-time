; Bullet Time + Dodge v2.0 (GTA SA Android, AML arm64)
; Letakkan di: /sdcard/Android/data/com.rockstargames.gtasa/configs/BulletTime.ini
; Animasi dodge: taruh MP3SD.ifp di /sdcard/Android/data/com.rockstargames.gtasa/files/BulletTime/MP3SD.ifp

[Main]
Enabled=1

[Debug]
; Matikan satu per satu (0) kalau ada crash, untuk mencari penyebabnya
HookPlayer=1
HookAnim=1
HookHydra=1
HookKill=0
HookAim=1

[BulletTime]
; Tombol hidrolik dimunculkan & aktif saat jalan kaki. Tap 1x = bullet time on/off
HydraulicsButtonOnFoot=1
; Tombol hidrolik di gamepad (mapping bawaan widget) ikut memicu
UseGamepadMapping=1
; Kecepatan dunia saat bullet time (1.0 normal)
WorldSpeed=0.35
; Kecepatan CJ relatif ke normal. Harus > WorldSpeed supaya CJ lebih cepat dari dunia
CJSpeed=0.6
BlendIn=0.12
BlendOut=0.25
; Bar adrenalin: lama bullet time dari penuh sampai habis (detik nyata)
Duration=14.0
; Isi ulang per detik saat menunggu (bullet time mati)
RefillPerSec=0.04
StartMeter=1.0
; Minimal isi bar untuk bisa mengaktifkan bullet time
ActivationMinimum=0.05
; Tambahan isi bar setiap kill. 0 = bar hanya terisi dengan menunggu.
; Kalau mau isi dari kill: KillRefill=0.2 dan HookKill=1
KillRefill=0.0

[Dodge]
; Tap 2x cepat tombol hidrolik = dodge. Arah ikut stik kiri (maju/mundur/kiri/kanan)
HydraulicsDoubleTapDodge=1
DoubleTapWindow=0.35
; Biaya bar per dodge
DodgeCost=0.15
; Dorongan horizontal dodge (satuan game per tick) dan lamanya (detik nyata)
DiveSpeed=0.30
DiveMoveSeconds=0.9
; Lompatan ke atas (0 = mati; coba 0.1-0.2 kalau mau)
DiveUpSpeed=0.0
; Dodge otomatis memicu slow motion selama sekian detik walau bullet time mati
AutoBulletTime=1
DiveSlowSeconds=2.5
; Animasi sd_dive_* dari MP3SD.ifp (varian 1 tangan / 2 tangan / dual dipilih otomatis dari senjata)
UseIFP=1
; Kosongkan = cari di files/BulletTime/MP3SD.ifp
IFPPath=
AnimBlend=8.0
; Pengali kecepatan animasi dodge (1.0 normal)
AnimSpeed=1.0
; 1 = kontrol dikunci selama dodge (tidak bisa menembak saat melayang)
LockControlsDuringDive=0
; 1 = saat dodge otomatis masuk mode bidik (kalau belum) dan bidikan tidak lepas selama melayang.
; Menembak lewat tombol tembak seperti biasa.
AimDuringDive=1
; 1 = menembak otomatis selama dodge (saat sedang membidik)
AutoFireDuringDive=0

[Bar]
; Posisi & ukuran bar (pecahan layar). Bar hanya tampil saat tidak penuh / bullet time aktif
X=0.30
Y=0.93
Width=0.40
Height=0.018
