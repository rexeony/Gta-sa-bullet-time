; Bullet Time (GTA SA Android, AML arm64)
; Letakkan di: /sdcard/Android/data/com.rockstargames.gtasa/configs/BulletTime.ini
; File ini dilengkapi otomatis saat game dijalankan. Hapus file lama kalau ada versi sebelumnya.
; Nama tombol pad: LeftShoulder1 LeftShoulder2 RightShoulder1 RightShoulder2 DPadUp DPadDown DPadLeft DPadRight
;                  Start Select ButtonSquare ButtonTriangle ButtonCross ButtonCircle ShockButtonL ShockButtonR None

[Main]
Enabled=1
; 1 = log tombol pad yang kamu sentuh ke logcat
DebugPad=0

[Debug]
; Matikan satu per satu untuk mencari penyebab masalah (0 = hook tidak dipasang)
HookPlayer=1
HookAnim=1
HookHydra=1
; Flag widget hidrolik (angka desimal) saat jalan kaki: bit yang dihapus / ditambah
HydraFlagClear=4
HydraFlagSet=0

[BulletTime]
; 1 = tombol hidrolik dimunculkan saat berjalan kaki (tidak aktif saat berkendara). Tap sekali = on, tap lagi = off
HydraulicsButtonOnFoot=1
; Tombol pad opsional (None = tidak dipakai)
ActivateButton=None
; Kecepatan dunia saat bullet time (1.0 normal; makin kecil makin lambat)
WorldSpeed=0.30
; Kecepatan CJ saat bullet time relatif ke normal. Harus lebih besar dari WorldSpeed supaya CJ lebih cepat dari dunia
CJSpeed=0.65
; Lama transisi masuk dan keluar (detik nyata), memakai kurva halus
BlendIn=0.35
BlendOut=0.55
; Meter adrenalin: lama bullet time penuh (detik nyata) dan isi ulang per detik
Duration=14.0
RefillPerSec=0.04
StartMeter=1.0
; Meter minimal untuk bisa mengaktifkan (0..1)
ActivationMinimum=0.05

[Bar]
; Bar adrenalin di layar saat jalan kaki (posisi/ukuran = pecahan layar)
ShowBar=1
BarX=0.35
BarY=0.04
BarWidth=0.30
BarHeight=0.022

[Effect]
; Warna biru tipis di layar saat bullet time (0..255 = kekuatan maksimum)
ScreenTint=1
TintAlpha=38
; Garis hitam atas-bawah layar (efek sinematik)
Letterbox=1
LetterboxHeight=0.07
LetterboxAlpha=150
